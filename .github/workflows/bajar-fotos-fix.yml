name: Bajar Fotos Fix
on:
  workflow_dispatch:
jobs:
  bajar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-output
      - name: Bajar
        run: python3 scripts/bajar_fotos_fix.py > /tmp/o.txt 2>&1 || true
      - name: Publicar
        run: |
          mkdir -p ops && cp /tmp/o.txt ops/fix-descarga.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A ops/
          git commit -m "ops: fotos de reemplazo $(date -u +%FT%TZ)" || true
          git push origin ops-output
