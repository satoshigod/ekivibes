name: Verificar Tiendas
on:
  workflow_dispatch:
jobs:
  ver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-output
      - name: Verificar
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: python3 scripts/verificar_tiendas.py > /tmp/o.txt 2>&1 || true
      - name: Publicar
        run: |
          mkdir -p ops && cp /tmp/o.txt ops/verificacion.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A ops/
          git commit -m "ops: verificacion tiendas $(date -u +%FT%TZ)" || true
          git push origin ops-output
