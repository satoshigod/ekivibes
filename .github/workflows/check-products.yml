name: Check Products

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Ninos products in Medusa
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" \
            -H "Content-Type: application/json" \
            --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')

          for ID in "prod_01KZPGA9173EFNVPTRM4ZFKHS2" "prod_01KZPGKJGYE9A7MCANTS6V0Z97"; do
            PROD=$(curl -s "$BASE/admin/products/$ID" -H "Authorization: Bearer $TOKEN")
            echo "$PROD" | python3 << 'PYEOF'
import sys, json
d = json.load(sys.stdin)["product"]
print("=== PRODUCTO ===")
print("ID:", d["id"])
print("Title:", d["title"])
print("Handle:", d["handle"])
print("Status:", d["status"])
sc = [s["id"] for s in d.get("sales_channels", [])]
print("Sales channels:", sc)
opts = [(o["id"], o["title"], [v["value"] for v in o.get("values", [])]) for o in d.get("options", [])]
print("Options:", opts)
vars_info = [(v["id"], v["title"], v.get("sku"), [p.get("amount") for p in v.get("prices", [])]) for v in d.get("variants", [])]
print("Variants:", vars_info)
PYEOF
          done
