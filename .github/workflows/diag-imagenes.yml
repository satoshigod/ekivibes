name: Diagnostico Imagenes
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-output
      - name: Recon imagenes en Medusa
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: python3 scripts/recon_imagenes.py > /tmp/a.txt 2>&1 || true
      - name: Listar fotos oficiales disponibles
        run: python3 scripts/listar_fotos_oficiales.py > /tmp/b.txt 2>&1 || true
      - name: Publicar
        run: |
          mkdir -p ops
          cp /tmp/a.txt ops/imagenes-medusa.txt
          cp /tmp/b.txt ops/fotos-oficiales.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A ops/
          git commit -m "ops: diagnostico imagenes $(date -u +%FT%TZ)" || true
          git push origin ops-output
