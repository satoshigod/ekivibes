name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Verify store API
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"
          PK="pk_3b5b6657ca34ef46e2b26e6b3ce00c63613f6fe3e6e327a0a8b5bbd19fcb657"

          echo "=== VH NINOS ==="
          curl -s "$BASE/store/products?handle=chaleco-airbag-vh-ninos&region_id=$REGION_ID&fields=id,handle,title,variants.id,variants.title,variants.calculated_price" \
            -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);p=d.get("products",[]);print("found:",len(p));[print(x["id"],x["handle"],[v["id"] for v in x.get("variants",[])]) for x in p]'

          echo "=== MLV NINOS ==="
          curl -s "$BASE/store/products?handle=chaleco-airbag-mlv3-h-ninos&region_id=$REGION_ID&fields=id,handle,title,variants.id,variants.title,variants.calculated_price" \
            -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);p=d.get("products",[]);print("found:",len(p));[print(x["id"],x["handle"],[v["id"] for v in x.get("variants",[])]) for x in p]'

          echo "=== TODOS LOS PRODUCTOS STORE ==="
          curl -s "$BASE/store/products?region_id=$REGION_ID&fields=id,handle,title&limit=20" \
            -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(p["id"],"|",p["handle"],"|",p["title"]) for p in d.get("products",[])]'
