name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Configure products Ninos via Medusa Admin API
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          VH_ID="prod_01KZPGA9173EFNVPTRM4ZFKHS2"
          MLV_ID="prod_01KZPGKJGYE9A7MCANTS6V0Z97"
          CHANNEL_ID="sc_01KZPAP849X2E6DFPE4GDAG7MC"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          echo ">> Login..."
          TOKEN=$(curl -sf "$BASE/auth/user/emailpass" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.MEDUSA_ADMIN_EMAIL }}\",\"password\":\"${{ secrets.MEDUSA_ADMIN_PASSWORD }}\"}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "Token OK"

          for PRODUCT_ID in $VH_ID $MLV_ID; do
            if [ "$PRODUCT_ID" = "$VH_ID" ]; then
              HANDLE="chaleco-airbag-vh-ninos"
              DESC="Chaleco airbag de equitación certificado CE para niños. Tela suave y elástica. Cartucho CO2 50cc. Talla niños XS (altura 125-135 cm)."
              VAR_TITLE="XS"
              SKU="VH-NINOS-XS"
              PRICE=1750000
            else
              HANDLE="chaleco-airbag-mlv3-h-ninos"
              DESC="Chaleco airbag de equitación certificado CE para niños. Cubre cuello, pecho, espalda y coxis. Cartucho CO2 50cc. Talla niños 2XS (altura 125-135 cm)."
              VAR_TITLE="2XS"
              SKU="MLV3H-NINOS-2XS"
              PRICE=1950000
            fi

            echo ">> Configurando $HANDLE..."

            # Actualizar handle, descripción, sales channel
            curl -sf -X POST "$BASE/admin/products/$PRODUCT_ID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"handle\":\"$HANDLE\",\"description\":\"$DESC\",\"status\":\"published\",\"sales_channels\":[{\"id\":\"$CHANNEL_ID\"}]}" > /dev/null
            echo "  handle y descripción OK"

            # Obtener variantes actuales
            PROD=$(curl -sf "$BASE/admin/products/$PRODUCT_ID" -H "Authorization: Bearer $TOKEN")
            VAR_COUNT=$(echo $PROD | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d["product"].get("variants",[])))')
            OPT_COUNT=$(echo $PROD | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d["product"].get("options",[])))')

            # Crear opción Talla si no existe
            if [ "$OPT_COUNT" = "0" ]; then
              OPT=$(curl -sf -X POST "$BASE/admin/products/$PRODUCT_ID/options" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"Talla\",\"values\":[\"$VAR_TITLE\"]}")
              OPT_ID=$(echo $OPT | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("product_option",{}).get("id","") or d.get("id",""))')
              echo "  Opción Talla creada: $OPT_ID"
            else
              OPT_ID=$(echo $PROD | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["product"]["options"][0]["id"])')
              echo "  Opción ya existe: $OPT_ID"
            fi

            # Crear o actualizar variante
            if [ "$VAR_COUNT" = "0" ]; then
              VAR=$(curl -sf -X POST "$BASE/admin/products/$PRODUCT_ID/variants" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"$VAR_TITLE\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"options\":{\"$OPT_ID\":\"$VAR_TITLE\"},\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\"}]}")
              VAR_ID=$(echo $VAR | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("variant",{}).get("id","") or d.get("id",""))')
              echo "  Variante creada: $VAR_ID"
            else
              VAR_ID=$(echo $PROD | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["product"]["variants"][0]["id"])')
              curl -sf -X POST "$BASE/admin/products/$PRODUCT_ID/variants/$VAR_ID" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"$VAR_TITLE\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\"}]}" > /dev/null
              echo "  Variante actualizada: $VAR_ID"
            fi

            # Inventory item + stock
            INV=$(curl -sf -X POST "$BASE/admin/inventory-items" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"sku\":\"$SKU\",\"requires_shipping\":true}")
            INV_ID=$(echo $INV | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("inventory_item",{}).get("id",""))')
            if [ -n "$INV_ID" ]; then
              curl -sf -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
              echo "  Inventario 100 unidades OK"
            fi

            echo "  $HANDLE listo"
          done
          echo "=== Todo listo ==="
