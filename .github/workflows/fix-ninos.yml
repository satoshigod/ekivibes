name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix lanyard prices and full inventory sweep
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          echo "VERSION-MARKER: lanyard-inv-v9"
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          echo "=== Buscando Lanyard ==="
          PRODS=$(curl -s "$BASE/admin/products?limit=50" -H "Authorization: Bearer $TOKEN")
          LAN_ID=$(echo "$PRODS" | python3 -c 'import sys,json;d=json.load(sys.stdin);r=[p["id"] for p in d.get("products",[]) if "Lanyard" in p.get("title","")];print(r[0] if r else "")')
          echo "lanyard id: $LAN_ID"

          LAN=$(curl -s "$BASE/admin/products/$LAN_ID" -H "Authorization: Bearer $TOKEN")
          echo "$LAN" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});[print(v["id"],v["title"]) for v in d.get("variants",[])]'

          S_VID=$(echo "$LAN" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});r=[v["id"] for v in d.get("variants",[]) if v["title"]=="S"];print(r[0] if r else "")')
          L_VID=$(echo "$LAN" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});r=[v["id"] for v in d.get("variants",[]) if v["title"]=="L"];print(r[0] if r else "")')
          echo "S: $S_VID  L: $L_VID"

          if [ -n "$S_VID" ]; then
            curl -s -X POST "$BASE/admin/products/$LAN_ID/variants/$S_VID" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"prices\":[{\"amount\":180000,\"currency_code\":\"cop\",\"region_id\":\"$REGION_ID\"}]}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("S precio:","ok" if "variant" in d else d)'
          fi
          if [ -n "$L_VID" ]; then
            curl -s -X POST "$BASE/admin/products/$LAN_ID/variants/$L_VID" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"prices\":[{\"amount\":180000,\"currency_code\":\"cop\",\"region_id\":\"$REGION_ID\"}]}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("L precio:","ok" if "variant" in d else d)'
          fi

          echo "=== BARRIDO COMPLETO DE INVENTARIO ==="
          PROD_IDS=$(echo "$PRODS" | python3 -c 'import sys,json;[print(p["id"]) for p in json.load(sys.stdin).get("products",[])]')
          for PID in $PROD_IDS; do
            P=$(curl -s "$BASE/admin/products/$PID" -H "Authorization: Bearer $TOKEN")
            VIDS=$(echo "$P" | python3 -c 'import sys,json;[print(v["id"]) for v in json.load(sys.stdin).get("product",{}).get("variants",[])]')
            for VID in $VIDS; do
              LINKED=$(curl -s "$BASE/admin/inventory-items?variant_id=$VID" -H "Authorization: Bearer $TOKEN")
              CNT=$(echo "$LINKED" | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("inventory_items",[])))')
              if [ "$CNT" = "0" ]; then
                INV=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"sku\":\"sweep-$(echo $VID | cut -c9-20)\",\"requires_shipping\":true}")
                INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
                if [ -n "$INV_ID" ]; then
                  curl -s -X POST "$BASE/admin/products/$PID/variants/$VID/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"inventory_item_id\":\"$INV_ID\",\"required_quantity\":1}" > /dev/null
                  curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
                  echo "+ creado: $VID -> $INV_ID"
                fi
              fi
            done
          done
          echo "=== DONE ==="
