name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix remaining MLV variants
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          echo "VERSION-MARKER: fix-mlv-v7"
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"
          MLV_ID="prod_01KZPGKJGYE9A7MCANTS6V0Z97"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          echo ">> MLV M"
          INV1=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"sku":"inv-mlv-m-v7","requires_shipping":true}')
          echo "  resp: $(echo $INV1 | head -c 200)"
          INV1_ID=$(echo "$INV1" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
          if [ -n "$INV1_ID" ]; then
            curl -s -X POST "$BASE/admin/products/$MLV_ID/variants/variant_01KZSWBEGV5C1YMTX53M2GSRZ1/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"inventory_item_id\":\"$INV1_ID\",\"required_quantity\":1}" > /dev/null
            curl -s -X POST "$BASE/admin/inventory-items/$INV1_ID/location-levels" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
            echo "  OK: $INV1_ID"
          fi

          echo ">> MLV L"
          INV2=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"sku":"inv-mlv-l-v7","requires_shipping":true}')
          echo "  resp: $(echo $INV2 | head -c 200)"
          INV2_ID=$(echo "$INV2" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
          if [ -n "$INV2_ID" ]; then
            curl -s -X POST "$BASE/admin/products/$MLV_ID/variants/variant_01KZSWBEW27M7RRZQ7FAKJFMDQ/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"inventory_item_id\":\"$INV2_ID\",\"required_quantity\":1}" > /dev/null
            curl -s -X POST "$BASE/admin/inventory-items/$INV2_ID/location-levels" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
            echo "  OK: $INV2_ID"
          fi

          echo "=== Buscando XS que se creo antes ==="
          PROD=$(curl -s "$BASE/admin/products/$MLV_ID" -H "Authorization: Bearer $TOKEN")
          echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});[print(v["id"],v["title"],v.get("sku")) for v in d.get("variants",[])]'

          echo "=== DONE ==="
