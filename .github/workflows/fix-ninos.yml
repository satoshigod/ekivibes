name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Configure products Ninos via Medusa Admin API
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          VH_ID="prod_01KZPGA9173EFNVPTRM4ZFKHS2"
          MLV_ID="prod_01KZPGKJGYE9A7MCANTS6V0Z97"
          CHANNEL_ID="sc_01KZPAP849X2E6DFPE4GDAG7MC"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"
          SK="sk_6cc40dda6dca3d3ff3270b7fb59d0344716671144cef4085ce26d083468b1ca4"

          setup_product() {
            PRODUCT_ID=$1
            HANDLE=$2
            DESC=$3
            VAR_TITLE=$4
            SKU=$5
            PRICE=$6

            echo ">> $HANDLE"

            curl -s -X POST "$BASE/admin/products/$PRODUCT_ID" \
              -H "x-medusa-access-token: $SK" \
              -H "Content-Type: application/json" \
              -d "{\"handle\":\"$HANDLE\",\"description\":\"$DESC\",\"status\":\"published\",\"sales_channels\":[{\"id\":\"$CHANNEL_ID\"}]}"
            echo "  handle OK"

            PROD=$(curl -s "$BASE/admin/products/$PRODUCT_ID" -H "x-medusa-access-token: $SK")
            VAR_COUNT=$(echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d["product"].get("variants",[])))')
            OPT_COUNT=$(echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d["product"].get("options",[])))')
            echo "  vars=$VAR_COUNT opts=$OPT_COUNT"

            if [ "$OPT_COUNT" = "0" ]; then
              OPT=$(curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/options" \
                -H "x-medusa-access-token: $SK" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"Talla\",\"values\":[\"$VAR_TITLE\"]}")
              echo "  OPT: $OPT"
              OPT_ID=$(echo "$OPT" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("product_option",{}).get("id","") or list(d.values())[0] if d else "")')
            else
              OPT_ID=$(echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["product"]["options"][0]["id"])')
            fi
            echo "  opt_id=$OPT_ID"

            if [ "$VAR_COUNT" = "0" ]; then
              VAR=$(curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/variants" \
                -H "x-medusa-access-token: $SK" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"$VAR_TITLE\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"options\":{\"$OPT_ID\":\"$VAR_TITLE\"},\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\"}]}")
              echo "  VAR: $VAR"
            else
              VAR_ID=$(echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["product"]["variants"][0]["id"])')
              curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/variants/$VAR_ID" \
                -H "x-medusa-access-token: $SK" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"$VAR_TITLE\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\"}]}"
              echo "  variante actualizada: $VAR_ID"
            fi

            INV=$(curl -s -X POST "$BASE/admin/inventory-items" \
              -H "x-medusa-access-token: $SK" \
              -H "Content-Type: application/json" \
              -d "{\"sku\":\"$SKU\",\"requires_shipping\":true}")
            INV_ID=$(echo "$INV" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("inventory_item",{}).get("id",""))')
            echo "  inv_id=$INV_ID"
            if [ -n "$INV_ID" ]; then
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" \
                -H "x-medusa-access-token: $SK" \
                -H "Content-Type: application/json" \
                -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}"
              echo "  stock OK"
            fi
          }

          setup_product "$VH_ID" "chaleco-airbag-vh-ninos" "Chaleco airbag CE para ninos. Talla XS (125-135cm)." "XS" "VH-NINOS-XS" 1750000
          setup_product "$MLV_ID" "chaleco-airbag-mlv3-h-ninos" "Chaleco airbag CE para ninos. Talla 2XS (125-135cm)." "2XS" "MLV3H-NINOS-2XS" 1950000
          echo "=== listo ==="
