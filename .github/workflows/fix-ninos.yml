name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')

          echo "=== API KEY DETALLE ==="
          curl -s "$BASE/admin/api-keys/apk_01KZC1XSHSVNJRJQ6SQ31F6FAM" \
            -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin);k=d.get("api_key",{});print("id:",k.get("id"));print("token:",k.get("token"));print("redacted:",k.get("redacted"))'

          echo "=== STORE con key del admin ==="
          curl -s "$BASE/store/products?region_id=$REGION_ID&limit=5" \
            -H "x-publishable-api-key: apk_01KZC1XSHSVNJRJQ6SQ31F6FAM" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("count:",d.get("count","err"));print(str(d)[:200])'
