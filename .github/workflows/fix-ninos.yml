name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix sales channel stock location link
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          SC_ID="sc_01KZPAP849X2E6DFPE4GDAG7MC"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          echo "=== Stock locations del sales channel ==="
          curl -s "$BASE/admin/stock-locations?sales_channel_id=$SC_ID" \
            -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(l["id"],l["name"]) for l in d.get("stock_locations",[])]'

          echo "=== Asociando BODEGA MEDELLIN al sales channel ==="
          RES=$(curl -s -X POST "$BASE/admin/stock-locations/$LOCATION_ID/sales-channels" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"add\":[\"$SC_ID\"]}")
          echo "Resp: $(echo $RES | head -c 200)"
