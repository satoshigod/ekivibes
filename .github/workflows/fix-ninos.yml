name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix variant inventory
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"
          VH_NINOS_VAR="variant_01KZSGCMBMY2S95CYYB8S5RZ4W"
          VH_NINOS_PROD="prod_01KZPGZYT740ZCEQBV4WDZ2ZXT"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          # Ver inventory items de esta variante especifica
          echo "=== Inventory items variant VH Ninos ==="
          LINKED=$(curl -s "$BASE/admin/inventory-items?variant_id=$VH_NINOS_VAR" -H "Authorization: Bearer $TOKEN")
          echo "linked: $(echo $LINKED | head -c 300)"

          INV_ID=$(echo "$LINKED" | python3 -c 'import sys,json;items=json.load(sys.stdin).get("inventory_items",[]);print(items[0]["id"] if items else "")')
          echo "inv_id: $INV_ID"

          if [ -z "$INV_ID" ]; then
            echo "Creando inventory item..."
            INV=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"sku":"VH-NINOS-XS-FINAL","requires_shipping":true}')
            echo "inv resp: $(echo $INV | head -c 200)"
            INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')

            echo "Enlazando a variante..."
            LINK=$(curl -s -X POST "$BASE/admin/products/$VH_NINOS_PROD/variants/$VH_NINOS_VAR/inventory-items" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"inventory_item_id\":\"$INV_ID\",\"required_quantity\":1}")
            echo "link resp: $(echo $LINK | head -c 200)"
          fi

          echo "Agregando stock en bodega..."
          STOCK=$(curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}")
          echo "stock resp: $(echo $STOCK | head -c 200)"

          echo "=== Verificando ==="
          LEVELS=$(curl -s "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN")
          echo "levels: $(echo $LEVELS | head -c 300)"
