name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix stock for all variants
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          # Obtener todos los inventory items
          INV_ITEMS=$(curl -s "$BASE/admin/inventory-items?limit=100" -H "Authorization: Bearer $TOKEN")
          INV_IDS=$(echo "$INV_ITEMS" | python3 -c 'import sys,json;[print(i["id"]) for i in json.load(sys.stdin).get("inventory_items",[])]')

          for INV_ID in $INV_IDS; do
            LEVELS=$(curl -s "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN")
            HAS=$(echo "$LEVELS" | python3 -c "import sys,json;ls=json.load(sys.stdin).get('inventory_levels',[]);print('yes' if any(l['location_id']=='$LOCATION_ID' for l in ls) else 'no')")
            STOCK=$(echo "$LEVELS" | python3 -c "import sys,json;ls=json.load(sys.stdin).get('inventory_levels',[]);match=[l for l in ls if l['location_id']=='$LOCATION_ID'];print(match[0]['stocked_quantity'] if match else 0)")

            if [ "$HAS" = "no" ]; then
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
              echo "+ stock creado: $INV_ID"
            elif [ "$STOCK" = "0" ]; then
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels/$LOCATION_ID" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"stocked_quantity\":100}" > /dev/null
              echo "~ stock actualizado a 100: $INV_ID"
            else
              echo "ok ($STOCK): $INV_ID"
            fi
          done
          echo "=== DONE ==="
