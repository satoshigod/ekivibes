name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Restore missing variants
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"
          VH_ID="prod_01KZPGA9173EFNVPTRM4ZFKHS2"
          MLV_ID="prod_01KZPGKJGYE9A7MCANTS6V0Z97"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          create_variant() {
            PROD_ID=$1 TALLA=$2 SKU=$3 PRICE=$4
            echo ">> Creando $TALLA..."
            RESP=$(curl -s -X POST "$BASE/admin/products/$PROD_ID/variants" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"title\":\"$TALLA\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"options\":{\"Talla\":\"$TALLA\"},\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\",\"region_id\":\"$REGION_ID\"}]}")
            # Medusa v2 devuelve el producto completo - buscar la variante por SKU
            VAR_ID=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);vs=[v['id'] for v in d.get('product',{}).get('variants',[]) if v.get('sku')=='$SKU'];print(vs[0] if vs else '')")
            echo "  var_id: $VAR_ID"

            if [ -n "$VAR_ID" ]; then
              INV=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"sku\":\"$SKU-inv\",\"requires_shipping\":true}")
              INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
              curl -s -X POST "$BASE/admin/products/$PROD_ID/variants/$VAR_ID/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"inventory_item_id\":\"$INV_ID\",\"required_quantity\":1}" > /dev/null
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
              echo "  stock 100 OK"
            else
              echo "  ERROR: no se encontro variante con SKU $SKU"
            fi
          }

          echo "=== VH Adulto ==="
          create_variant "$VH_ID" "S" "VH-ADU-S2" 2850000
          create_variant "$VH_ID" "L" "VH-ADU-L2" 2850000

          echo "=== MLV Adulto ==="
          create_variant "$MLV_ID" "M" "MLV-ADU-M2" 2850000
          create_variant "$MLV_ID" "L" "MLV-ADU-L2" 2850000

          echo "=== DONE ==="
