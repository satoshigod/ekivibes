name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure inventory for new variants
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          echo "VERSION-MARKER: inventory-v6"
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          VARIANTS="variant_01KZSWBDPSD7AHGP986W37BCCR variant_01KZSWBE5AA12BNH3SDCE6BXAE variant_01KZSWBEGV5C1YMTX53M2GSRZ1 variant_01KZSWBEW27M7RRZQ7FAKJFMDQ"

          for VAR_ID in $VARIANTS; do
            echo ">> $VAR_ID"
            LINKED=$(curl -s "$BASE/admin/inventory-items?variant_id=$VAR_ID" -H "Authorization: Bearer $TOKEN")
            LINKED_COUNT=$(echo "$LINKED" | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("inventory_items",[])))')
            echo "  linked: $LINKED_COUNT"

            if [ "$LINKED_COUNT" = "0" ]; then
              INV=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"sku\":\"inv-v6-$(echo $VAR_ID | cut -c9-16)\",\"requires_shipping\":true}")
              INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
              echo "  inv creado: $INV_ID"

              PRODS=$(curl -s "$BASE/admin/products?limit=50" -H "Authorization: Bearer $TOKEN")
              PROD_ID=$(echo "$PRODS" | python3 -c "import sys,json;d=json.load(sys.stdin);r=[p['id'] for p in d.get('products',[]) for v in p.get('variants',[]) if v['id']=='$VAR_ID'];print(r[0] if r else '')")
              echo "  prod: $PROD_ID"

              curl -s -X POST "$BASE/admin/products/$PROD_ID/variants/$VAR_ID/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"inventory_item_id\":\"$INV_ID\",\"required_quantity\":1}" > /dev/null
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
              echo "  stock 100 OK"
            else
              echo "  ya enlazado, verificando stock..."
              INV_ID=$(echo "$LINKED" | python3 -c 'import sys,json;print(json.load(sys.stdin)["inventory_items"][0]["id"])')
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels/$LOCATION_ID" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"stocked_quantity\":100}" > /dev/null
              echo "  stock actualizado 100"
            fi
          done
          echo "=== DONE ==="
