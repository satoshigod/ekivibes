name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix sales channel
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          VH_ID="prod_01KZPGZYT740ZCEQBV4WDZ2ZXT"
          MLV_ID="prod_01KZPH5JBJCFTASQ5EMVNQZMDB"
          SC_ID="sc_01KZPAP849X2E6DFPE4GDAG7MC"
          PK="pk_3b5a6a9ce085bb5120a9b09c89e650604dae941aa324a34078ada7a038d04657"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          echo ">> Asociando VH Ninos al sales channel..."
          curl -s -X POST "$BASE/admin/products/$VH_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sales_channels\":[{\"id\":\"$SC_ID\"}]}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("VH SC:",[s["id"] for s in d.get("product",{}).get("sales_channels",[])])'

          echo ">> Asociando MLV Ninos al sales channel..."
          curl -s -X POST "$BASE/admin/products/$MLV_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sales_channels\":[{\"id\":\"$SC_ID\"}]}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("MLV SC:",[s["id"] for s in d.get("product",{}).get("sales_channels",[])])'

          echo "=== VERIFICANDO ==="
          sleep 2
          curl -s "$BASE/store/products?handle=chaleco-airbag-vh-ninos&region_id=$REGION_ID" \
            -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("VH found:",len(d.get("products",[])))'
          curl -s "$BASE/store/products?handle=chaleco-airbag-mlv3-h-ninos&region_id=$REGION_ID" \
            -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("MLV found:",len(d.get("products",[])))'
