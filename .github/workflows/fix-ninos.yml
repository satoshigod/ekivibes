name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Ninos
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          VH_ID="prod_01KZPGZYT740ZCEQBV4WDZ2ZXT"
          MLV_ID="prod_01KZPH5JBJCFTASQ5EMVNQZMDB"
          VH_OPT_ID="opt_01KZPGZYT7S2MPW2GV0QK9WFEK"
          MLV_OPT_ID="opt_01KZPH5JBJ7DQ82WM09WYGFN75"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"
          PK="pk_3b5b6657ca34ef46e2b26e6b3ce00c63613f6fe3e6e327a0a8b5bbd19fcb657"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          add_variant() {
            PRODUCT_ID=$1 OPT_ID=$2 VAR_TITLE=$3 SKU=$4 PRICE=$5

            echo ">> $SKU"

            # Agregar valor a la opcion
            echo "  Agregando valor $VAR_TITLE a opcion $OPT_ID..."
            curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/options/$OPT_ID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"values\":[\"$VAR_TITLE\"]}" | head -c 200
            echo ""

            # Crear variante
            VAR=$(curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/variants" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"$VAR_TITLE\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"options\":{\"$OPT_ID\":\"$VAR_TITLE\"},\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\",\"region_id\":\"$REGION_ID\"}]}")
            VAR_ID=$(echo "$VAR" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("variant",{}).get("id",""))')
            echo "  variante: $VAR_ID"
            echo "  resp: $(echo $VAR | head -c 200)"

            # Stock
            INV_EXISTING=$(curl -s "$BASE/admin/inventory-items?q=$SKU" -H "Authorization: Bearer $TOKEN")
            INV_ID=$(echo "$INV_EXISTING" | python3 -c 'import sys,json;items=json.load(sys.stdin).get("inventory_items",[]);print(items[0]["id"] if items else "")')
            if [ -z "$INV_ID" ]; then
              INV=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"sku\":\"$SKU\",\"requires_shipping\":true}")
              INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
            fi
            if [ -n "$INV_ID" ]; then
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
              echo "  stock OK: $INV_ID"
            fi
          }

          add_variant "$VH_ID" "$VH_OPT_ID" "XS" "VH-NINOS-XS-4" 1750000
          add_variant "$MLV_ID" "$MLV_OPT_ID" "2XS" "MLV3H-NINOS-2XS-4" 1950000

          echo "=== STORE API ==="
          sleep 5
          curl -s "$BASE/store/products?handle=chaleco-airbag-vh-ninos&region_id=$REGION_ID" -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);p=d.get("products",[]);print("VH found:",len(p))'
          curl -s "$BASE/store/products?handle=chaleco-airbag-mlv3-h-ninos&region_id=$REGION_ID" -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);p=d.get("products",[]);print("MLV found:",len(p))'
          echo "=== DONE ==="
