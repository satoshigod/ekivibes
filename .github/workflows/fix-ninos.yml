name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Link inventory items to variants
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          PRODS=$(curl -s "$BASE/admin/products?limit=50" -H "Authorization: Bearer $TOKEN")
          PROD_IDS=$(echo "$PRODS" | python3 -c 'import sys,json;[print(p["id"]) for p in json.load(sys.stdin).get("products",[])]')

          for PROD_ID in $PROD_IDS; do
            PROD=$(curl -s "$BASE/admin/products/$PROD_ID" -H "Authorization: Bearer $TOKEN")
            TITLE=$(echo "$PROD" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("product",{}).get("title",""))')
            echo ">> $TITLE"

            VARIANTS=$(echo "$PROD" | python3 -c 'import sys,json;[print(v["id"],v.get("sku","no-sku")) for v in json.load(sys.stdin).get("product",{}).get("variants",[])]')

            while IFS=" " read -r VAR_ID VAR_SKU; do
              [ -z "$VAR_ID" ] && continue

              # Ver inventory items enlazados via variant_id
              LINKED=$(curl -s "$BASE/admin/inventory-items?variant_id=$VAR_ID" -H "Authorization: Bearer $TOKEN")
              LINKED_COUNT=$(echo "$LINKED" | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("inventory_items",[])))')

              if [ "$LINKED_COUNT" = "0" ]; then
                # Crear inventory item
                SKU_USE="inv-$(echo $VAR_ID | cut -c1-8)"
                INV=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"sku\":\"$SKU_USE\",\"requires_shipping\":true}")
                INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')

                if [ -n "$INV_ID" ]; then
                  # Enlazar inventory item a variante
                  LINK=$(curl -s -X POST "$BASE/admin/products/$PROD_ID/variants/$VAR_ID/inventory-items" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"inventory_item_id\":\"$INV_ID\",\"required_quantity\":1}")
                  echo "  link resp: $(echo $LINK | head -c 100)"

                  # Stock en bodega
                  curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null

                  echo "  + $VAR_SKU -> $INV_ID stock 100"
                fi
              else
                # Ya tiene inventory item - asegurar stock en bodega
                INV_ID=$(echo "$LINKED" | python3 -c 'import sys,json;print(json.load(sys.stdin)["inventory_items"][0]["id"])')
                LEVELS=$(curl -s "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN")
                HAS=$(echo "$LEVELS" | python3 -c "import sys,json;ls=json.load(sys.stdin).get('inventory_levels',[]);print('yes' if any(l['location_id']=='$LOCATION_ID' for l in ls) else 'no')")
                if [ "$HAS" = "no" ]; then
                  curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
                  echo "  + stock bodega: $VAR_SKU"
                else
                  echo "  ~ ok: $VAR_SKU"
                fi
              fi
            done <<< "$VARIANTS"
          done
          echo "=== DONE ==="
