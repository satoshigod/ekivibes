name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix sales channel and verify
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"
          SC_ID="sc_01KZPAP849X2E6DFPE4GDAG7MC"
          PK="pk_3b5a6a9ce085bb5120a9b09c89e650604dae941aa324a34078ada7a038d04657"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          echo "=== REGION DETALLE ==="
          curl -s "$BASE/admin/regions/$REGION_ID" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("region",{});print("name:",d.get("name"));print("currency:",d.get("currency_code"));print("countries:",[c["iso_2"] for c in d.get("countries",[])])'

          echo "=== STORE PRODUCTS con PK correcto ==="
          curl -s "$BASE/store/products?region_id=$REGION_ID&limit=5" \
            -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("count:",d.get("count"));print(str(d)[:300])'

          echo "=== STORE REGIONS ==="
          curl -s "$BASE/store/regions" \
            -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(str(d)[:400])'
