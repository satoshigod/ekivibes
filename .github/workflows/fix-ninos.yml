name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Ninos
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          VH_ID="prod_01KZPGA9173EFNVPTRM4ZFKHS2"
          MLV_ID="prod_01KZPGKJGYE9A7MCANTS6V0Z97"
          CHANNEL_ID="sc_01KZPAP849X2E6DFPE4GDAG7MC"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token: ${TOKEN:0:15}..."

          process_product() {
            PRODUCT_ID=$1 HANDLE=$2 VAR_TITLE=$3 SKU=$4 PRICE=$5
            echo ""
            echo "=== $HANDLE ==="
            PROD=$(curl -s "$BASE/admin/products/$PRODUCT_ID" -H "Authorization: Bearer $TOKEN")
            echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});print("Handle:",d.get("handle"));print("Variants:",[v["title"]+"("+str(len(v.get("prices",[])))+"prices)" for v in d.get("variants",[])])'

            OPT_COUNT=$(echo "$PROD" | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("product",{}).get("options",[])))')
            VAR_COUNT=$(echo "$PROD" | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("product",{}).get("variants",[])))')

            if [ "$OPT_COUNT" = "0" ]; then
              OPT=$(curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/options" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"title\":\"Talla\",\"values\":[\"$VAR_TITLE\"]}")
              OPT_ID=$(echo "$OPT" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("product_option",{}).get("id",""))')
            else
              OPT_ID=$(echo "$PROD" | python3 -c 'import sys,json;print(json.load(sys.stdin)["product"]["options"][0]["id"])')
            fi
            echo "opt_id=$OPT_ID"

            if [ "$VAR_COUNT" = "0" ]; then
              VAR=$(curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/variants" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"title\":\"$VAR_TITLE\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"options\":{\"$OPT_ID\":\"$VAR_TITLE\"},\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\"}]}")
              echo "Variante creada: $(echo $VAR | python3 -c 'import sys,json;print(json.load(sys.stdin).get("variant",{}).get("id","err"))')"
            else
              VAR_ID=$(echo "$PROD" | python3 -c 'import sys,json;print(json.load(sys.stdin)["product"]["variants"][0]["id"])')
              echo "Actualizando variante $VAR_ID..."
              curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/variants/$VAR_ID" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"title\":\"$VAR_TITLE\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\"}]}" > /dev/null
              echo "Variante actualizada OK"
              EXTRA_IDS=$(echo "$PROD" | python3 -c 'import sys,json;vs=json.load(sys.stdin)["product"]["variants"];[print(v["id"]) for v in vs[1:]]')
              for EXTRA_ID in $EXTRA_IDS; do
                echo "Borrando variante extra: $EXTRA_ID"
                curl -s -X DELETE "$BASE/admin/products/$PRODUCT_ID/variants/$EXTRA_ID" -H "Authorization: Bearer $TOKEN" > /dev/null
              done
            fi

            curl -s -X POST "$BASE/admin/products/$PRODUCT_ID" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"sales_channels\":[{\"id\":\"$CHANNEL_ID\"}]}" > /dev/null
            echo "Sales channel OK"

            INV=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"sku\":\"$SKU\",\"requires_shipping\":true}")
            INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
            if [ -n "$INV_ID" ]; then
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
              echo "Stock 100 OK: $INV_ID"
            else
              echo "Inventory: $(echo $INV | head -c 100)"
            fi
          }

          process_product "$VH_ID" "chaleco-airbag-vh-ninos" "XS" "VH-NINOS-XS" 1750000
          process_product "$MLV_ID" "chaleco-airbag-mlv3-h-ninos" "2XS" "MLV3H-NINOS-2XS" 1950000
          echo "=== DONE ==="
