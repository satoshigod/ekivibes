name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Configure products Ninos via Medusa Admin API
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          VH_ID="prod_01KZPGA9173EFNVPTRM4ZFKHS2"
          MLV_ID="prod_01KZPGKJGYE9A7MCANTS6V0Z97"
          CHANNEL_ID="sc_01KZPAP849X2E6DFPE4GDAG7MC"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          echo ">> Login..."
          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" \
            -H "Content-Type: application/json" \
            -d '{"email":"ivancorrea@plazablack.com","password":"Ekivibes2026"}')
          echo "LOGIN: $LOGIN"
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("token",""))')
          echo "TOKEN: ${TOKEN:0:20}..."

          if [ -z "$TOKEN" ]; then
            echo "Login fallido"
            exit 1
          fi

          for PRODUCT_ID in "$VH_ID" "$MLV_ID"; do
            if [ "$PRODUCT_ID" = "$VH_ID" ]; then
              HANDLE="chaleco-airbag-vh-ninos"
              DESC="Chaleco airbag CE para ninos talla XS"
              VAR_TITLE="XS"
              SKU="VH-NINOS-XS"
              PRICE=1750000
            else
              HANDLE="chaleco-airbag-mlv3-h-ninos"
              DESC="Chaleco airbag CE para ninos talla 2XS"
              VAR_TITLE="2XS"
              SKU="MLV3H-NINOS-2XS"
              PRICE=1950000
            fi

            echo ">> $HANDLE"

            curl -s -X POST "$BASE/admin/products/$PRODUCT_ID" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"handle\":\"$HANDLE\",\"description\":\"$DESC\",\"status\":\"published\",\"sales_channels\":[{\"id\":\"$CHANNEL_ID\"}]}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("  handle OK" if "product" in d else f"  ERROR: {d}")'

            PROD=$(curl -s "$BASE/admin/products/$PRODUCT_ID" -H "Authorization: Bearer $TOKEN")
            VAR_COUNT=$(echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d.get("product",{}).get("variants",[])))')
            OPT_COUNT=$(echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d.get("product",{}).get("options",[])))')
            echo "  vars=$VAR_COUNT opts=$OPT_COUNT"

            if [ "$OPT_COUNT" = "0" ]; then
              OPT=$(curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/options" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"Talla\",\"values\":[\"$VAR_TITLE\"]}")
              echo "  OPT_RESP: $OPT"
              OPT_ID=$(echo "$OPT" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("product_option",{}).get("id",""))')
            else
              OPT_ID=$(echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["product"]["options"][0]["id"])')
            fi
            echo "  opt_id=$OPT_ID"

            if [ "$VAR_COUNT" = "0" ]; then
              VAR=$(curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/variants" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"$VAR_TITLE\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"options\":{\"$OPT_ID\":\"$VAR_TITLE\"},\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\"}]}")
              echo "  VAR_RESP: $VAR"
            else
              VAR_ID=$(echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["product"]["variants"][0]["id"])')
              curl -s -X POST "$BASE/admin/products/$PRODUCT_ID/variants/$VAR_ID" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"title\":\"$VAR_TITLE\",\"sku\":\"$SKU\",\"manage_inventory\":true,\"prices\":[{\"amount\":$PRICE,\"currency_code\":\"cop\"}]}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(f"  var actualizada: {d.get(\"variant\",{}).get(\"id\",d)}")'
            fi

            INV=$(curl -s -X POST "$BASE/admin/inventory-items" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"sku\":\"$SKU\",\"requires_shipping\":true}")
            INV_ID=$(echo "$INV" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("inventory_item",{}).get("id",""))')
            echo "  inv_id=$INV_ID"
            if [ -n "$INV_ID" ]; then
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(f"  stock: {\"OK\" if \"inventory_level\" in d else d}")'
            fi
          done
          echo "=== listo ==="
