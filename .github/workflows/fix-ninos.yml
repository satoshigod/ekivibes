name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and fix
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"
          VH_ID="prod_01KZPGA9173EFNVPTRM4ZFKHS2"
          MLV_ID="prod_01KZPGKJGYE9A7MCANTS6V0Z97"
          MLV_NINOS_ID="prod_01KZPH5JBJCFTASQ5EMVNQZMDB"
          MLV_NINOS_VAR="variant_01KZSGE1C0F33PNVZXDBXBR49G"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          echo "=== VH ADULTO OPTIONS ==="
          curl -s "$BASE/admin/products/$VH_ID" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});[print("opt:",o["id"],o["title"],"values:",[v["value"] for v in o.get("values",[])]) for o in d.get("options",[])]'

          echo "=== MLV ADULTO OPTIONS ==="
          curl -s "$BASE/admin/products/$MLV_ID" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});[print("opt:",o["id"],o["title"],"values:",[v["value"] for v in o.get("values",[])]) for o in d.get("options",[])]'

          echo "=== MLV NINOS VAR ==="
          curl -s "$BASE/admin/products/$MLV_NINOS_ID" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});[print("var:",v["id"],v["title"]) for v in d.get("variants",[])]'
