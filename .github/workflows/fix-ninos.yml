name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix prices with region_id
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          VH_ID="prod_01KZPGZYT740ZCEQBV4WDZ2ZXT"
          MLV_ID="prod_01KZPH5JBJCFTASQ5EMVNQZMDB"
          VH_VAR_ID="variant_01KZSGCMBMY2S95CYYB8S5RZ4W"
          MLV_VAR_ID="variant_01KZSGE1C0F33PNVZXDBXBR49G"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          echo ">> Actualizando precio VH Ninos con region_id..."
          RES=$(curl -s -X POST "$BASE/admin/products/$VH_ID/variants/$VH_VAR_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"prices\":[{\"amount\":1750000,\"currency_code\":\"cop\"},{\"amount\":1750000,\"currency_code\":\"cop\",\"rules\":{\"region_id\":\"$REGION_ID\"}}]}")
          echo "VH: $(echo $RES | head -c 200)"

          echo ">> Actualizando precio MLV Ninos con region_id..."
          RES=$(curl -s -X POST "$BASE/admin/products/$MLV_ID/variants/$MLV_VAR_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"prices\":[{\"amount\":1950000,\"currency_code\":\"cop\"},{\"amount\":1950000,\"currency_code\":\"cop\",\"rules\":{\"region_id\":\"$REGION_ID\"}}]}")
          echo "MLV: $(echo $RES | head -c 200)"

          echo "=== DONE ==="
