name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Ninos
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          VH_ID="prod_01KZPGZYT740ZCEQBV4WDZ2ZXT"
          MLV_ID="prod_01KZPH5JBJCFTASQ5EMVNQZMDB"
          VH_OPT_ID="opt_01KZPGZYT7S2MPW2GV0QK9WFEK"
          MLV_OPT_ID="opt_01KZPH5JBJ7DQ82WM09WYGFN75"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token: ${TOKEN:0:15}..."

          # VH Ninos - crear variante XS con precio
          echo ">> VH Ninos - creando variante XS..."
          VAR=$(curl -s -X POST "$BASE/admin/products/$VH_ID/variants" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"XS\",\"sku\":\"VH-NINOS-XS\",\"manage_inventory\":true,\"options\":{\"$VH_OPT_ID\":\"XS\"},\"prices\":[{\"amount\":1750000,\"currency_code\":\"cop\"}]}")
          echo "VH VAR: $(echo $VAR | head -c 300)"

          # MLV Ninos - crear variante 2XS con precio
          echo ">> MLV Ninos - creando variante 2XS..."
          VAR=$(curl -s -X POST "$BASE/admin/products/$MLV_ID/variants" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"2XS\",\"sku\":\"MLV3H-NINOS-2XS\",\"manage_inventory\":true,\"options\":{\"$MLV_OPT_ID\":\"2XS\"},\"prices\":[{\"amount\":1950000,\"currency_code\":\"cop\"}]}")
          echo "MLV VAR: $(echo $VAR | head -c 300)"

          # Crear inventory items y stock
          for SKU in "VH-NINOS-XS" "MLV3H-NINOS-2XS"; do
            INV=$(curl -s -X POST "$BASE/admin/inventory-items" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"sku\":\"$SKU\",\"requires_shipping\":true}")
            INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
            if [ -n "$INV_ID" ]; then
              curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
              echo "Stock $SKU OK: $INV_ID"
            else
              echo "Inventory $SKU: $(echo $INV | head -c 150)"
            fi
          done
          echo "=== DONE ==="
