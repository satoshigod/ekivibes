name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup duplicate inventory
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          # Borrar SKUs duplicados - dejar solo VH-NINOS-XS y MLV3H-NINOS-2XS
          for SKU in "VH-NINOS-XS-2" "VH-NINOS-XS-3" "VH-NINOS-XS-4" "VH-NINOS-XS-5" "MLV3H-NINOS-2XS-2" "MLV3H-NINOS-2XS-3" "MLV3H-NINOS-2XS-4" "MLV3H-NINOS-2XS-5"; do
            INV=$(curl -s "$BASE/admin/inventory-items?q=$SKU" -H "Authorization: Bearer $TOKEN")
            INV_ID=$(echo "$INV" | python3 -c 'import sys,json;items=json.load(sys.stdin).get("inventory_items",[]);print(items[0]["id"] if items else "")')
            if [ -n "$INV_ID" ]; then
              curl -s -X DELETE "$BASE/admin/inventory-items/$INV_ID" -H "Authorization: Bearer $TOKEN" > /dev/null
              echo "Borrado: $SKU ($INV_ID)"
            fi
          done
          echo "=== Limpieza completada ==="
