name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Check store API
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"
          PK="pk_3b5b6657ca34ef46e2b26e6b3ce00c63613f6fe3e6e327a0a8b5bbd19fcb657"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          echo "=== ADMIN VH NINOS ==="
          VH=$(curl -s "$BASE/admin/products/prod_01KZPGZYT740ZCEQBV4WDZ2ZXT" -H "Authorization: Bearer $TOKEN")
          echo "$VH" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});print("handle:",d.get("handle"));print("variants:",len(d.get("variants",[])));[print("  ",v["id"],v["title"],v.get("sku"),v.get("prices",[])) for v in d.get("variants",[])]'

          echo "=== ADMIN MLV NINOS ==="
          MLV=$(curl -s "$BASE/admin/products/prod_01KZPH5JBJCFTASQ5EMVNQZMDB" -H "Authorization: Bearer $TOKEN")
          echo "$MLV" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});print("handle:",d.get("handle"));print("variants:",len(d.get("variants",[])));[print("  ",v["id"],v["title"],v.get("sku"),v.get("prices",[])) for v in d.get("variants",[])]'

          echo "=== STORE API VH ==="
          curl -s "$BASE/store/products?handle=chaleco-airbag-vh-ninos&region_id=$REGION_ID" -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("found:",len(d.get("products",[])));print(str(d)[:400])'

          echo "=== STORE API MLV ==="
          curl -s "$BASE/store/products?handle=chaleco-airbag-mlv3-h-ninos&region_id=$REGION_ID" -H "x-publishable-api-key: $PK" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("found:",len(d.get("products",[])));print(str(d)[:400])'
