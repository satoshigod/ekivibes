name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix all failing variants
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          fix_variant() {
            VAR_ID=$1
            echo ">> $VAR_ID"

            # Crear inventory item
            INV=$(curl -s -X POST "$BASE/admin/inventory-items" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"sku\":\"fix-$(echo $VAR_ID | cut -c9-20)\",\"requires_shipping\":true}")
            INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
            echo "  inv: $INV_ID"

            if [ -z "$INV_ID" ]; then
              echo "  ERROR creando inventory item: $(echo $INV | head -c 100)"
              return
            fi

            # Buscar el producto al que pertenece esta variante
            PRODS=$(curl -s "$BASE/admin/products?limit=50" -H "Authorization: Bearer $TOKEN")
            PROD_ID=$(echo "$PRODS" | python3 -c "
import sys,json
d=json.load(sys.stdin)
for p in d.get('products',[]):
    for v in p.get('variants',[]):
        if v['id'] == '$VAR_ID':
            print(p['id'])
            break
")
            echo "  prod: $PROD_ID"

            # Enlazar inventory item a variante
            LINK=$(curl -s -X POST "$BASE/admin/products/$PROD_ID/variants/$VAR_ID/inventory-items" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"inventory_item_id\":\"$INV_ID\",\"required_quantity\":1}")
            echo "  link: $(echo $LINK | head -c 150)"

            # Stock en bodega
            curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
            echo "  stock 100 OK"
          }

          fix_variant "variant_01KZSGE1C0F33PNVZXDBXBR49G"
          fix_variant "variant_01KZPGKJKHXTWJN4AAFNMNQFSH"
          fix_variant "variant_01KZPHH7HR3VQADVBBX402P8ZE"
          fix_variant "variant_01KZPHDZ77F93TEXE15489HB01"
          fix_variant "variant_01KZPHRBKSHQYJWWFM6FZJJVZQ"
          fix_variant "variant_01KZSGCMBMY2S95CYYB8S5RZ4W"

          echo "=== DONE ==="
