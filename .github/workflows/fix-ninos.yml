name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Set inventory for all products
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          # Obtener todos los productos
          PRODS=$(curl -s "$BASE/admin/products?limit=50" -H "Authorization: Bearer $TOKEN")
          PROD_IDS=$(echo "$PRODS" | python3 -c 'import sys,json;[print(p["id"]) for p in json.load(sys.stdin).get("products",[])]')

          for PROD_ID in $PROD_IDS; do
            PROD=$(curl -s "$BASE/admin/products/$PROD_ID" -H "Authorization: Bearer $TOKEN")
            TITLE=$(echo "$PROD" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("product",{}).get("title",""))')
            VARIANTS=$(echo "$PROD" | python3 -c 'import sys,json;[print(v["id"],v.get("sku","")) for v in json.load(sys.stdin).get("product",{}).get("variants",[])]')

            echo ">> $TITLE"
            while IFS=" " read -r VAR_ID VAR_SKU; do
              [ -z "$VAR_ID" ] && continue

              # Buscar inventory item de esta variante
              INV_ITEMS=$(curl -s "$BASE/admin/inventory-items?q=$VAR_SKU" -H "Authorization: Bearer $TOKEN")
              INV_ID=$(echo "$INV_ITEMS" | python3 -c 'import sys,json;items=json.load(sys.stdin).get("inventory_items",[]);print(items[0]["id"] if items else "")')

              if [ -z "$INV_ID" ]; then
                # Crear inventory item
                INV=$(curl -s -X POST "$BASE/admin/inventory-items" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"sku\":\"$VAR_SKU\",\"requires_shipping\":true}")
                INV_ID=$(echo "$INV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("inventory_item",{}).get("id",""))')
              fi

              if [ -n "$INV_ID" ]; then
                # Verificar si ya tiene stock en bodega
                LEVELS=$(curl -s "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN")
                HAS_LEVEL=$(echo "$LEVELS" | python3 -c "import sys,json;levels=json.load(sys.stdin).get('inventory_levels',[]);print('yes' if any(l['location_id']=='$LOCATION_ID' for l in levels) else 'no')")

                if [ "$HAS_LEVEL" = "no" ]; then
                  curl -s -X POST "$BASE/admin/inventory-items/$INV_ID/location-levels" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"location_id\":\"$LOCATION_ID\",\"stocked_quantity\":100}" > /dev/null
                  echo "  + stock 100: $VAR_SKU ($INV_ID)"
                else
                  echo "  ~ ya tiene stock: $VAR_SKU"
                fi
              fi
            done <<< "$VARIANTS"
          done
          echo "=== DONE ==="
