name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and complete
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          echo "VERSION-MARKER: verify-v5"
          BASE="https://ekivibes-production.up.railway.app"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"
          REGION_ID="reg_01KZPA5VQ4345MB8FP453A5EED"
          VH_ID="prod_01KZPGA9173EFNVPTRM4ZFKHS2"
          MLV_ID="prod_01KZPGKJGYE9A7MCANTS6V0Z97"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          echo "Token OK"

          echo "=== VH ADULTO detalle ==="
          curl -s "$BASE/admin/products/$VH_ID" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});[print(v["id"],v["title"],"sku:",v.get("sku"),"prices:",[(p.get("currency_code"),p.get("amount")) for p in v.get("prices",[])]) for v in d.get("variants",[])]'

          echo "=== MLV ADULTO detalle ==="
          curl -s "$BASE/admin/products/$MLV_ID" -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});[print(v["id"],v["title"],"sku:",v.get("sku"),"prices:",[(p.get("currency_code"),p.get("amount")) for p in v.get("prices",[])]) for v in d.get("variants",[])]'

          echo "=== Creando MLV XS ==="
          RESP=$(curl -s -X POST "$BASE/admin/products/$MLV_ID/variants" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"title\":\"XS\",\"sku\":\"MLV-ADU-XS-v5\",\"manage_inventory\":true,\"options\":{\"Talla\":\"XS\"},\"prices\":[{\"amount\":2850000,\"currency_code\":\"cop\",\"region_id\":\"$REGION_ID\"}]}")
          echo "resp: $(echo $RESP | head -c 300)"
