name: Fix Ninos Products

on:
  workflow_dispatch:

jobs:
  fix-ninos:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Ninos
        env:
          MEDUSA_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
          MEDUSA_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
        run: |
          BASE="https://ekivibes-production.up.railway.app"
          VH_ID="prod_01KZPGA9173EFNVPTRM4ZFKHS2"
          MLV_ID="prod_01KZPGKJGYE9A7MCANTS6V0Z97"
          VH_ADULTO_ID="prod_01KZPGA9173EFNVPTRM4ZFKHS1"
          CHANNEL_ID="sc_01KZPAP849X2E6DFPE4GDAG7MC"
          LOCATION_ID="sloc_01KZPAFBNMW4WBK5VRZQA5G1C2"

          LOGIN=$(curl -s -X POST "$BASE/auth/user/emailpass" -H "Content-Type: application/json" --data-raw "{\"email\":\"${MEDUSA_EMAIL}\",\"password\":\"${MEDUSA_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')

          echo "=== ESTADO ACTUAL DE LOS 4 PRODUCTOS ==="
          for ID in "prod_01KZPGA9173EFNVPTRM4ZFKHS2" "prod_01KZPGKJGYE9A7MCANTS6V0Z97"; do
            PROD=$(curl -s "$BASE/admin/products/$ID" -H "Authorization: Bearer $TOKEN")
            echo "$PROD" | python3 -c 'import sys,json;d=json.load(sys.stdin).get("product",{});print("---");print("ID:",d.get("id"));print("Title:",d.get("title"));print("Handle:",d.get("handle"));[print("  VAR:",v["id"],v["title"],v.get("sku"),[(p.get("currency_code"),p.get("amount")) for p in v.get("prices",[])]) for v in d.get("variants",[])]'
          done
